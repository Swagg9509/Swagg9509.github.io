<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAGG9509</title>

<style>
body{
    margin:0;
    background:#000;
    color:#00ff41;
    font-family:Consolas, monospace;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

.container{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

.box{
    background:rgba(0,0,0,0.8);
    border:1px solid #00ff41;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 0 20px #00ff41;
}

h1{
    margin:0;
}

.prompt{
    color:#00ff41;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">

<div class="box">
<h1>SWAGG9509</h1>
<p>> ACCESS GRANTED</p>
<p>> Welcome Guys</p>
</div>

<div class="box">
<p class="prompt">user@swagg9509:~$ whoami</p>
<p>Developer | Creator | Future IT-specialist</p>
</div>

<div class="box">
<p class="prompt">user@swagg9509:~$ projects</p>
<p>- Website Development</p>
<p>- GitHub Projects</p>
<p>- Future AI Experiments</p>
</div>

<div class="box">
<p class="prompt">user@swagg9509:~$ status</p>
<p>ONLINE <span class="blink">█</span></p>
</div>

</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const chars =
"01アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ";

const arr = chars.split("");

const fontSize = 16;
const columns = canvas.width/fontSize;

const drops=[];

for(let x=0;x<columns;x++){
    drops[x]=1;
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff41";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){
        const text=arr[Math.floor(Math.random()*arr.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,35);
</script>

</body>
</html>
